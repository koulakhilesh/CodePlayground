[project]
name = "codeplayground"
version = "0.1.0"
description = "A personal playground for data science, ML, and coding experiments."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Akhilesh Koul" }]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "contextily>=1.7.0",
    "gender-guesser>=0.4.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "kaleido>=1.3.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.11.0",
    "nbformat>=5.10.0",
    "neo4j>=5.28.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "spacy>=3.8.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["london-blue-plaques", "gita-knowledge-graph"]
markers = ["integration: requires the en_core_web_sm model or a live service"]
