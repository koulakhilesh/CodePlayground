[project]
name = "codeplayground"
version = "0.1.0"
description = "A personal playground for data science, ML, and coding experiments."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Akhilesh Koul" }]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "contextily>=1.7.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.11.0",
    "nbformat>=5.10.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
